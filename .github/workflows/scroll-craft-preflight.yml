name: Scroll Craft preflight
on:
  push:
    branches: [codex/scroll-craft-3d-2026-10-28]
    paths: ['tools/scroll-craft/**', '.github/workflows/scroll-craft-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCROLLCRAFT_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Install the full media tooling required by Scroll Craft
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: node tools/scroll-craft/scripts/doctor.mjs
      - run: node tools/scroll-craft/scripts/workspace.mjs --ensure
