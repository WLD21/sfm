name: Verify Scroll Craft 3D experience
on:
  push:
    branches: [codex/scroll-craft-3d-2026-10-28]
permissions:
  contents: write
concurrency:
  group: scroll-craft-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install and resolve 3D dependencies
        run: npm install --no-audit --no-fund
      - name: Install complete Scroll Craft media tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run the unmodified upstream preflight
        run: |
          node scripts/verify-skill-source.mjs
          node tools/scroll-craft/scripts/doctor.mjs
      - name: Capture exact fallbacks from the final 3D scenes
        run: npm run capture:scenes
      - name: Unit checks
        run: npm test
      - name: Check the browser already included in the runner
        run: google-chrome --version
      - name: Browser regression and new experience checks
        run: npm run test:browser -- --workers=2
      - name: Build website and self-contained HTML
        run: npm run build
      - name: Verify the exact standalone file offline
        run: npm run test:standalone
      - name: Verify production scroll transitions with the upstream harness
        run: npm run verify:scrollcraft
      - name: Save verified generated files to this feature branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/save-verified-build.mjs
      - name: Package complete source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('.')
          excluded = {'.git', 'node_modules', '.cache', 'test-results', 'playwright-report', 'release'}
          out = root / 'release'
          out.mkdir(exist_ok=True)
          with ZipFile(out / 'Supreme-Fitness-Massage-Source.zip', 'w', ZIP_DEFLATED) as z:
              for path in root.rglob('*'):
                  if path.is_file() and not any(part in excluded for part in path.parts):
                      z.write(path, Path('Supreme-Fitness-Massage') / path)
          with ZipFile(out / 'Supreme-Fitness-Massage-Source.zip') as z:
              assert z.testzip() is None
              assert 'Supreme-Fitness-Massage/src/experience.jsx' in z.namelist()
              assert 'Supreme-Fitness-Massage/OPEN-WEBSITE.html' in z.namelist()
              assert len(z.namelist()) > 25
              print('Verified source ZIP entries:', len(z.namelist()))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: Supreme-Fitness-Massage-scroll-craft-3d
          path: |
            release/Supreme-Fitness-Massage-Source.zip
            OPEN-WEBSITE.html
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: scroll-craft-test-results
          path: |
            test-results
            docs/previews
            public/images/scene-*.png
          retention-days: 7
